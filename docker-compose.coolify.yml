# Deployment compose for Coolify/Traefik.
#
# Unlike docker-compose.yml (the local demo, which binds host ports
# 127.0.0.1:8081 and 8082), this file exposes no host ports: Traefik routes
# to frontend and dashboard over the Coolify network on TLS, so nothing is
# reachable on plain 8081/8082 (see the vault runbook "Öffentliche Ports
# 8081/8082 (ichbinhier-form)"). The dashboard Sign-in cookie is Secure, so
# fronting via TLS is mandatory.
#
# Each Coolify environment (main/staging/develop) deploys this file with its
# own Postgres service and volumes, so the three run side by side without
# sharing data.
services:
  db:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_DB: volunteer_form
      POSTGRES_USER: volunteer_form
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in environment}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U volunteer_form -d volunteer_form' ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    expose:
      - '8080'
    environment:
      DB_URL: jdbc:postgresql://db:5432/volunteer_form
      DB_USERNAME: volunteer_form
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in environment}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
      DOCUMENT_UPLOAD_DIR: /var/lib/ichbinhier/documents
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE-demo}
      STAFF_1_PASSWORD: ${STAFF_1_PASSWORD:-}
      STAFF_2_PASSWORD: ${STAFF_2_PASSWORD:-}
      STAFF_3_PASSWORD: ${STAFF_3_PASSWORD:-}
      STAFF_4_PASSWORD: ${STAFF_4_PASSWORD:-}
      STAFF_5_PASSWORD: ${STAFF_5_PASSWORD:-}
    volumes:
      - document-files:/var/lib/ichbinhier/documents
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    expose:
      - '80'
    environment:
      BASIC_AUTH_USERNAME: ${BASIC_AUTH_USERNAME:-}
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD:-}
    depends_on:
      - backend
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
    expose:
      - '80'
    environment:
      BASIC_AUTH_USERNAME: ${BASIC_AUTH_USERNAME:-}
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD:-}
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db-data:
  document-files:
