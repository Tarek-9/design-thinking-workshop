# Serves the form and proxies the API from one origin, so no CORS applies.
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Crawlers that read headers only: the prototype carries another organisation's branding.
  add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "same-origin" always;

  # Written by docker-entrypoint.sh from BASIC_AUTH_USERNAME and BASIC_AUTH_PASSWORD.
  # Empty when unset, so the local demo stays open.
  include /etc/nginx/conf.d/auth.d/auth.conf;

  gzip on;
  gzip_vary on;
  gzip_min_length 512;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Without a variable, nginx keeps a replaced backend's old IP and answers 502.
  # Docker's DNS resolver re-resolves it per request.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /api/ {
    # Matches the backend's 20 MB multipart ceiling (application.properties).
    # nginx's default of 1 MB would refuse a legitimate document upload.
    client_max_body_size 20m;
    set $backend http://backend:8080;
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  # Fingerprinted by the build, so they can be cached hard.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # Not fingerprinted and not for shared caches.
  location /fonts/ {
    expires 30d;
    add_header Cache-Control "private, max-age=2592000" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
