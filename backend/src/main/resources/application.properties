spring.application.name=volunteer-form-service

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/volunteer_form}
spring.datasource.username=${DB_USERNAME:volunteer_form}
spring.datasource.password=${DB_PASSWORD:volunteer_form}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# RESEND_API_KEY binds to resend.api-key. Leave it without a default: an absent key
# selects NoopEmailSender, an empty one would send mail with an empty key.
resend.from=${RESEND_FROM:onboarding@resend.dev}

# The sign-in throttle counts failures per address. Behind nginx, every request
# would otherwise share the proxy's address and lock out all staff at once.
server.forward-headers-strategy=framework

# Applicant uploads. Compose mounts a named volume here, with random UUID names.
document.upload-dir=${DOCUMENT_UPLOAD_DIR:/var/lib/ichbinhier/documents}

# Above the per-file limit in DocumentProperties, so an oversized file gets
# DOCUMENT_TOO_LARGE from the service. If document.max-file-size goes above these, raise them too.
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=20MB

sign-in.inactivity=12h
sign-in.attempt-limit=5
sign-in.attempt-window=15m

# Initial passwords for seeded accounts. Empty on purpose: StaffSeeder refuses
# to start rather than invent one, but only for accounts it has to create.
staff.seed-passwords[0]=${STAFF_1_PASSWORD:}
staff.seed-passwords[1]=${STAFF_2_PASSWORD:}
staff.seed-passwords[2]=${STAFF_3_PASSWORD:}
staff.seed-passwords[3]=${STAFF_4_PASSWORD:}
staff.seed-passwords[4]=${STAFF_5_PASSWORD:}
